name: Bug report
description: Report a reproducible CAE correctness, compatibility, setup, or uninstall problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a CAE problem. Do not include credentials, raw prompts, private source code, Codex transcripts, account identifiers, or raw session/turn ids.
  - type: input
    id: cae-version
    attributes:
      label: CAE version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex version
      placeholder: codex 0.x.y
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform/runtime
      placeholder: Ubuntu 24.04, Windows 11, macOS, codexu, etc.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use synthetic/non-sensitive data. Include the CAE command or workflow and the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only sanitized output.
    validations:
      required: true
  - type: dropdown
    id: repeatable
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Intermittent
        - Happened once
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identifiers, raw prompts/transcripts, and private source data from this report.
          required: true